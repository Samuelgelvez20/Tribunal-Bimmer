<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39" />
      <stop offset="50%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#1c202a" />
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <clipPath id="innerCircleClip">
      <circle cx="50" cy="50" r="27" />
    </clipPath>
  </defs>

  <!-- Borde exterior plateado -->
  <circle cx="50" cy="50" r="48" fill="url(#silverTrim)" stroke="#475569" stroke-width="0.8" />

  <!-- Anillo exterior negro BMW -->
  <circle cx="50" cy="50" r="45" fill="url(#ringGrad)" stroke="#111827" stroke-width="0.8" />

  <!-- Letras B - M - W arqueadas y estilizadas -->
  <text x="32" y="19" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="9.5" fill="#ffffff" text-anchor="middle" transform="rotate(-38 32 19)">B</text>
  <text x="50" y="14" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle">M</text>
  <text x="68" y="19" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif" font-weight="900" font-size="9.5" fill="#ffffff" text-anchor="middle" transform="rotate(38 68 19)">W</text>

  <!-- Borde interior plateado -->
  <circle cx="50" cy="50" r="27.5" fill="none" stroke="url(#silverTrim)" stroke-width="1.2" />

  <!-- Cuadrantes interiores de la hélice bávara (Azul y Blanco) -->
  <g clip-path="url(#innerCircleClip)">
    <rect x="20" y="20" width="60" height="60" fill="#ffffff" />
    <!-- Cuadrante superior-izquierdo: Azul BMW -->
    <path d="M 50,50 L 20,50 A 30,30 0 0,1 50,20 Z" fill="#0066B1" />
    <!-- Cuadrante inferior-derecho: Azul BMW -->
    <path d="M 50,50 L 80,50 A 30,30 0 0,1 50,80 Z" fill="#0066B1" />
    <!-- Líneas divisorias en cruz -->
    <line x1="20" y1="50" x2="80" y2="50" stroke="#cbd5e1" stroke-width="0.8" />
    <line x1="50" y1="20" x2="50" y2="80" stroke="#cbd5e1" stroke-width="0.8" />
  </g>
</svg>

